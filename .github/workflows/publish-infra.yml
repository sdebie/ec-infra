name: Publish Migrations Library to GitHub Packages

on:
  push:
    branches:
      - main

# Opt into Node 24 globally for all actions in this workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-jar:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Download the infra repo source (migrations/ is a subdirectory of it)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 21 with Maven dependency caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # 3. Configure Maven to use GitHub Packages as a repository
      - name: Configure Maven for GitHub Packages Auth
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github-parent",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      # 4. Compile, package, and deploy only the migrations module — the
      #    ec-infra app itself (FlywayMain, root pom.xml) publishes as a
      #    Docker image via jib, never as a Maven artifact, so it has
      #    nothing to deploy here.
      - name: Publish migrations jar to GitHub Packages
        run: mvn --batch-mode -f migrations/pom.xml deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
